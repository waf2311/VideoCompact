name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download ffmpeg / ffprobe
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-tmp -Force
          $ffmpeg = Get-ChildItem -Path ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path ffmpeg-tmp -Recurse -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $ffmpeg.FullName .\ffmpeg.exe
          Copy-Item $ffprobe.FullName .\ffprobe.exe
          Remove-Item -Recurse -Force ffmpeg-tmp, ffmpeg.zip

      - name: Install build deps
        run: python -m pip install --disable-pip-version-check pyinstaller pystray pillow

      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm --clean VideoCompact.spec

      - name: Prepare default folders
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path dist\VideoCompact\input, dist\VideoCompact\output | Out-Null

      - name: Zip artifact
        shell: pwsh
        run: Compress-Archive -Path dist\VideoCompact\* -DestinationPath VideoCompact-win64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoCompact-win64
          path: VideoCompact-win64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: VideoCompact-win64.zip
